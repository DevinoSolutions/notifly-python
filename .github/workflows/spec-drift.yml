name: Spec drift

# Watches the live Notifly OpenAPI document for changes that would make this SDK wrong.
# The loudest of the three checks is the ENVELOPE CONTRACT: notifly_py._envelope unwraps
# single-key `{"data": ...}` bodies at runtime, so if the API ever stops wrapping, that fix
# inverts into a bug. See scripts/check_drift.py.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # check_drift.py imports notifly_py (the internal-ops registry), which needs the package's
      # runtime deps (httpx). Same install as ci.yml; without it the check crashed on import.
      - name: Install project and dev dependencies
        run: uv sync --group dev
      - name: Compare the committed spec against the live public document
        id: drift
        run: uv run --no-sync python scripts/check_drift.py --format markdown --output drift-report.md
        continue-on-error: true
      - name: Open an issue on drift
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // The check can fail BEFORE writing its report (e.g. the live fetch errors): still open the
            // issue, naming the crash and the run, instead of crashing this step on a missing file.
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = fs.existsSync('drift-report.md')
              ? fs.readFileSync('drift-report.md', 'utf8')
              : '## Drift check crashed before writing a report\n\n' +
                `See the "Compare the committed spec" step log: ${runUrl}\n`;
            const title = 'Notifly API spec drift detected';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'spec-drift',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['spec-drift'],
              });
            }
      - name: Fail the run when drift was detected
        if: steps.drift.outcome == 'failure'
        run: exit 1
