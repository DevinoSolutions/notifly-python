name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ruff (lint)
        run: python -m pip install --upgrade pip && pip install ruff==0.16.0 && ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project and dev dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}
      - name: Pytest
        run: uv run --no-sync pytest -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project and dev dependencies
        run: uv sync --group dev
      - name: mypy (strict, hand-written layer)
        run: uv run --no-sync mypy

  build-and-import:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel and smoke-test the public surface
        run: |
          pip install dist/*.whl
          python - <<'PY'
          import notifly_py
          from notifly_py import Notifly, NotiflyClient, __version__

          assert __version__ == "0.1.0", __version__
          client = NotiflyClient(token="sk_ci_smoke")
          assert client.prefix == "ApiKey", client.prefix
          notifly = Notifly(client=client)
          for group in ("events", "subscribers", "topics", "workflows", "messages", "notifications", "integrations"):
              assert hasattr(notifly, group), group
          from notifly_py.api.events import events_controller_trigger  # generated escape hatch
          assert hasattr(events_controller_trigger, "sync")
          print("smoke ok", __version__, notifly_py.user_agent())
          PY
