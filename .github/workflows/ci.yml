name: CI

on:
  push:
    branches: [main]
  pull_request:

# runs-on stays GitHub-hosted (ubuntu-latest) on purpose: this repo is PUBLIC and the org's
# self-hosted ubuntu-devino fleet sits in the Default runner group, which does not allow public
# repositories (allows_public_repositories=false, checked 2026-09-23) — jobs would queue forever.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ruff (lint)
        run: python -m pip install --upgrade pip && pip install ruff==0.16.0 && ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project and dev dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}
      - name: Pytest
        run: uv run --no-sync pytest -q

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project and dev dependencies
        run: uv sync --group dev
      - name: Live API smoke
        # Hits the real Notifly API with a NON-PRODUCTION secret key. Skips loudly
        # when the secret is absent, e.g. on forks.
        env:
          NOTIFLY_SECRET_KEY: ${{ secrets.NOTIFLY_SECRET_KEY }}
          NOTIFLY_E2E_WORKFLOW: ${{ secrets.NOTIFLY_E2E_WORKFLOW }}
        run: uv run --no-sync pytest tests/e2e -v -rs

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project and dev dependencies
        run: uv sync --group dev
      - name: mypy (strict, hand-written layer)
        run: uv run --no-sync mypy

  build-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel and smoke-test the public surface
        run: |
          pip install dist/*.whl
          python -P - <<'PY'
          import pathlib, tomllib
          import notifly_py
          from notifly_py import Notifly, NotiflyClient, __version__

          expected = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          assert __version__ == expected, (__version__, expected)
          client = NotiflyClient(token="sk_ci_smoke")
          assert client.prefix == "ApiKey", client.prefix
          notifly = Notifly(client=client)
          for group in ("events", "subscribers", "topics", "workflows", "messages", "notifications", "integrations"):
              assert hasattr(notifly, group), group
          from notifly_py.api.events import events_controller_trigger  # generated escape hatch
          assert hasattr(events_controller_trigger, "sync")
          print("smoke ok", __version__, notifly_py.user_agent())
          PY
