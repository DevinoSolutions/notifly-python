name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Ruff (lint)
        run: python -m pip install --upgrade pip && pip install ruff==0.16.0 && ruff check .

  build-and-import:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel and smoke-test import
        run: |
          pip install dist/*.whl
          python -c "
          from notifly_py import AuthenticatedClient, Client
          from notifly_py.models import TriggerEventRequestDto, TriggerEventRequestDtoPayload
          from notifly_py.api.events import events_controller_trigger
          payload = TriggerEventRequestDtoPayload()
          payload.additional_properties = {'body': 'ci smoke'}
          dto = TriggerEventRequestDto(name='wf', to='sub', payload=payload)
          assert dto.to_dict()['name'] == 'wf'
          print('smoke ok')
          "
