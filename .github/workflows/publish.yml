# Publishes `notifly-sdk` to PyPI with Trusted Publishing (OIDC) — no API token, no password.
#
# The trusted publisher registered on PyPI is:
#   PyPI Project Name: notifly-sdk      <- the DISTRIBUTION name; the import package
#                                          stays `notifly_py`
#   Owner:             DevinoSolutions
#   Repository name:   notifly-python
#   Workflow name:     publish.yml
#   Environment name:  (any)
# Any mismatch between those claims and this file fails the OIDC exchange with
# `invalid-publisher`. The `pypi` environment used below is allowed because the publisher
# was registered without an environment restriction.
#
# HOW TO RELEASE
#   Push a tag: `git tag vX.Y.Z && git push origin vX.Y.Z`. The tag must match the version in
#   pyproject.toml — the assert-version job fails the release otherwise. `workflow_dispatch`
#   is kept for re-runs and dry runs; it publishes whatever version the checked-out tree
#   declares, and PyPI rejects a version that already exists.
#
# runs-on stays GitHub-hosted (ubuntu-latest) on purpose: this repo is PUBLIC and the org's
# self-hosted ubuntu-devino fleet sits in the Default runner group, which does not allow public
# repositories (allows_public_repositories=false, checked 2026-09-23).
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assert-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read the package version and check it against the tag
        id: version
        run: |
          version="$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "pyproject version: ${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            echo "tag version:       ${tag_version}"
            if [ "${tag_version}" != "${version}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
              exit 1
            fi
          fi

  verify:
    needs: assert-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Install project and dev dependencies
        run: uv sync --group dev
      - name: Ruff, mypy and the full test suite must pass before publishing
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync mypy
          uv run --no-sync pytest -q

  build-and-publish:
    needs: [assert-version, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          print-hash: true
